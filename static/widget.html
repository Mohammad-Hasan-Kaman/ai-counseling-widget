<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>چت سامانه پذیرش نیک‌روان</title>
<link rel="stylesheet" href="/static/widget.css?v=5">
</head>
<body>
<div id="chat-app">
  <div id="chat-header">
    <div class="hd-info">
      <div class="hd-title">🌸 سامانه هوشمند پذیرش __TENANT_NAME__</div>
      <div class="hd-sub">مناسب‌ترین مشاور را به شما معرفی می‌کنیم</div>
    </div>
    <button id="btn-close" title="بستن">✕</button>
  </div>
  <div id="chat-scroll">
    <div id="chat-messages"></div>
    <div id="quick-replies"></div>
  </div>
  <form id="input-bar" autocomplete="off">
    <input type="text" id="msg-input" placeholder="پیام خود را بنویسید...">
    <button type="submit" id="btn-send">ارسال</button>
  </form>
</div>
<script src="/static/widget-app.js?v=5"></script>
</body>
</html>
